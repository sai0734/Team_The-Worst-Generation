spring.application.name=backend

springdotenv.directory=../

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/BABYDB
spring.datasource.username=BABYDBUSER
spring.datasource.password=BABYDBUSER

# schema.sql is idempotent (CREATE TABLE IF NOT EXISTS) so it's safe to run on every startup
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mappers/**/*.xml
# YSJ - quest domain 타입 별칭 포함
mybatis.type-aliases-package=com.backend.domain,com.backend.quest.domain
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.backend.mapper=trace
# YSJ - quest mapper SQL 로그
logging.level.com.backend.quest.mapper=trace

logging.level.org.springframework.security.web=trace

spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB

com.backend.upload.path=upload

# KYI
# OpenClaw integration
openclaw.internal-key=${OPENCLAW_INTERNAL_KEY:}

# Ollama (로컬 온디바이스 AI, ai/ollama 참고)
ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:parenting-qwen:8b}

# SafetyKorea(국가기술표준원 제품안전정보센터) 리콜/인증정보 Open API
# 키 없으면 호출 시 에러만 나고 서버는 정상 기동
safetykorea.base-url=${SAFETYKOREA_BASE_URL:http://www.safetykorea.kr/openapi/api}
safetykorea.api-key=${SAFETYKOREA_API_KEY:}
# KYI 끝

#LMJ
google.vision.api-key=${GOOGLE_VISION_API_KEY:}
ollama.vision-model=${OLLAMA_VISION_MODEL:llava}

# JWT 서명 시크릿 (JWTUtil.java 하드코딩 값을 여기로 이동)
jwt.secret=${JWT_SECRET:}

#LDH
emergency.api.base-url=${EMERGENCY_API_BASE_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService}
emergency.api.service-key=${EMERGENCY_API_SERVICE_KEY:}

#LDH 끝

# YSJ - 정부지원금 공공 API / OpenClaw Gateway
data.go.kr.service-key=${DATA_GO_KR_SERVICE_KEY:}
openclaw.base-url=${OPENCLAW_BASE_URL:http://127.0.0.1:18789}
openclaw.gateway-token=${OPENCLAW_GATEWAY_TOKEN:}
openclaw.message.dry-run=${OPENCLAW_MESSAGE_DRY_RUN:true}

# HWH
# TossPayments 인화주문 결제
toss.secret-key=${TOSS_SECRET_KEY:}
ollama.diary-vision-model=${OLLAMA_DIARY_VISION_MODEL:qwen2.5vl:7b}

# Kling AI 영상생성
kling.api-key=${KLING_API_KEY:}
kling.base-url=${KLING_BASE_URL:https://api-singapore.klingai.com}
kling.model-name=${KLING_MODEL_NAME:kling-v1-6}

# AI행동교정 - 네이버 뉴스검색 API / 유튜브 Data API
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
youtube.api-key=${YOUTUBE_API_KEY:}
