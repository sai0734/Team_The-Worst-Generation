spring.application.name=backend

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/BABYDB
spring.datasource.username=BABYDBUSER
spring.datasource.password=BABYDBUSER

# schema.sql is idempotent (CREATE TABLE IF NOT EXISTS) so it's safe to run on every startup
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mappers/**/*.xml
# YSJ - quest domain 타입 별칭 포함
mybatis.type-aliases-package=com.backend.domain,com.backend.quest.domain
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.backend.mapper=trace
# YSJ - quest mapper SQL 로그
logging.level.com.backend.quest.mapper=trace

logging.level.org.springframework.security.web=trace

spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB

com.backend.upload.path=upload

# KYI
# OpenClaw integration
openclaw.internal-key=${OPENCLAW_INTERNAL_KEY:}

# Ollama (로컬 온디바이스 AI, ai/ollama 참고)
ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.model=${OLLAMA_MODEL:parenting-qwen:8b}
