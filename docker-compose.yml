services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: BABYDB
      MARIADB_USER: BABYDBUSER
      MARIADB_PASSWORD: BABYDBUSER
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./baby_back
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/BABYDB
      SPRING_DATASOURCE_USERNAME: BABYDBUSER
      SPRING_DATASOURCE_PASSWORD: BABYDBUSER
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: parenting-qwen:8b
      OLLAMA_VISION_MODEL: llava
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build: ./baby_front
    ports:
      - "3000:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ai/ollama:/modelfiles:ro

  openclaw:
    build: ./ai/openclaw
    depends_on:
      - ollama
    volumes:
      - openclaw_data:/root/.openclaw

volumes:
  mariadb_data:
  ollama_data:
  openclaw_data:
