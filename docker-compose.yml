services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: BABYDB
      MARIADB_USER: BABYDBUSER
      MARIADB_PASSWORD: BABYDBUSER
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./baby_back
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/BABYDB
      SPRING_DATASOURCE_USERNAME: BABYDBUSER
      SPRING_DATASOURCE_PASSWORD: BABYDBUSER
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build: ./baby_front
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
